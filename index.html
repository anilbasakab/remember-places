<script>
// Stand-alone mode (outside claude.ai): saves changes in this browser and seeds from seed.json
(function () {
  if (window.claude) return;
  const KEY = "patna-places:";
  const read = (c) => { try { const v = localStorage.getItem(KEY + c); return v ? JSON.parse(v) : null; } catch { return null; } };
  const write = (c, v) => { try { localStorage.setItem(KEY + c, JSON.stringify(v)); } catch {} };
  let SEED = null; const seedP = fetch("seed.json", { cache: "no-cache" }).then((r) => r.json()).then((s) => (SEED = s)).catch(() => (SEED = {}));
  const subs = {};
  const getCol = (c) => read(c) || (SEED && SEED[c] ? JSON.parse(JSON.stringify(SEED[c])) : {});
  const snap = (c) => { const o = getCol(c); return { docs: Object.entries(o).map(([id, d]) => ({ id, exists: true, data: () => d, metadata: {} })), size: Object.keys(o).length, empty: !Object.keys(o).length, docChanges: () => [], metadata: {} }; };
  const emit = (c) => (subs[c] || []).forEach((f) => { try { f(snap(c)); } catch (e) { console.error(e); } });
  const mut = (c, fn) => { const o = getCol(c); fn(o); write(c, o); setTimeout(() => emit(c), 0); };
  const db = {
    collection(c) {
      return {
        path: c,
        onSnapshot(f) { (subs[c] = subs[c] || []).push(f); seedP.then(() => f(snap(c))); return () => { subs[c] = subs[c].filter((x) => x !== f); }; },
        async get() { await seedP; return snap(c); },
        doc(id) {
          id = id || Math.random().toString(36).slice(2, 12);
          return { id, path: c + "/" + id,
            async get() { await seedP; const d = getCol(c)[id]; return { id, exists: !!d, data: () => d }; },
            async set(d) { await seedP; mut(c, (o) => { o[id] = JSON.parse(JSON.stringify(d)); }); },
            async update(d) { await seedP; mut(c, (o) => { o[id] = { ...(o[id] || {}), ...JSON.parse(JSON.stringify(d)) }; }); },
            async delete() { await seedP; mut(c, (o) => { delete o[id]; }); } };
        },
        async add(d) { const ref = this.doc(); await ref.set(d); return ref; },
      };
    },
  };
  const downloads = { async save({ filename, data }) { const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); } };
  window.claude = { use: async (n) => (n === "db" ? db : n === "downloads" ? downloads : null) };
})();

function nearestOnRoute(key, pt) {

      out.push({ t: "Road", name: nm, sub: `Part of ${r.name}`, dot: `class="dot bar" style="--c:var(--${r.cls})"`, go: () => { const ws = RD.ways.filter((x) => x[4] === nm); const longest = ws.reduce((a, b) => wayLen(b[3]) > wayLen(a[3]) ? b : a); go({ mode: "road", key: w[1], way: RD.ways.indexOf(longest), tap: null }); flyWays(ws); } });
    });
  }
  return out;
}
(() => {
  const input = $("#q"), list = $("#q-res");
  let hits = [], sel = 0;
  const norm = (t) => String(t || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9ऀ-ॿ]+/g, " ").trim();
  const score = (item, q) => {
    const n = norm(item.name), a = norm(item.alt), s2 = norm(item.sub);
    if (n === q) return 0; if (n.startsWith(q)) return 1; if (n.split(" ").some((w) => w.startsWith(q))) return 2;
    if (a && a.includes(q)) return 2.5; if (n.includes(q)) return 3; if (s2.includes(q)) return 4;
    if (q.length > 3 && n.replace(/ /g, "").includes(q.replace(/ /g, ""))) return 3.5;
    return -1;
  };
  const close = () => { list.hidden = true; input.setAttribute("aria-expanded", "false"); };
  const show = () => {
    const q = norm(input.value);
    if (!q) { close(); return; }
    hits = searchIndex().map((it) => [score(it, q), it]).filter(([s]) => s >= 0).sort((a, b) => a[0] - b[0] || a[1].name.length - b[1].name.length).slice(0, 12).map(([, it]) => it);
    sel = 0;
    list.innerHTML = hits.length ? hits.map((h, i) => `<li role="option" id="q-${i}" data-i="${i}" aria-selected="${i === sel}"><span class="dot" ${h.dot}></span><span class="nm">${esc(h.name)}${h.sub ? `<small>${esc(h.sub)}</small>` : ""}</span><span class="ty">${esc(h.t)}</span></li>`).join("")
      : `<li class="none">Nothing matches “${esc(input.value)}”. Try part of the name, such as “Gandhi” or “NH”.</li>`;
    list.hidden = false; input.setAttribute("aria-expanded", "true");
  };
  const pick = (i) => { const h = hits[i]; if (!h) return; close(); input.value = h.name; input.blur(); h.go(); };
  const mark = () => list.querySelectorAll("li[data-i]").forEach((li) => { const on = +li.dataset.i === sel; li.setAttribute("aria-selected", String(on)); if (on) li.scrollIntoView({ block: "nearest" }); });
  input.addEventListener("input", show);
  input.addEventListener("focus", () => { if (input.value) show(); });
  input.addEventListener("keydown", (e) => {
    if (list.hidden) return;
    if (e.key === "ArrowDown") { sel = Math.min(hits.length - 1, sel + 1); mark(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { sel = Math.max(0, sel - 1); mark(); e.preventDefault(); }
    else if (e.key === "Enter") { pick(sel); e.preventDefault(); }
    else if (e.key === "Escape") close();
  });
  list.addEventListener("pointerdown", (e) => { const li = e.target.closest("li[data-i]"); if (li) { e.preventDefault(); pick(+li.dataset.i); } });
  document.addEventListener("pointerdown", (e) => { if (!e.target.closest(".search")) close(); });
})();

// the city's spine: Saguna Mor → Income Tax Golambar → Gandhi Maidan → Ashok Rajpath → Patna City
function spineStops() { const byName = (n) => LANDMARKS.find((l) => l.name === n); return ["Saguna Mor", "Income Tax Golambar", "Gandhi Maidan", "PMCH", "Takht Sri Harmandir Sahib"].map(byName).filter(Boolean); }
function drawSpine() {
  const stops = spineStops(), pts = [];
  for (let i = 0; i < stops.length - 1; i++) { const r = roadRoute(stops[i], stops[i + 1]); pts.push(...(r ? r.path : [[stops[i].lat, stops[i].lng], [stops[i + 1].lat, stops[i + 1].lng]])); }
  L.polyline(pts, { color: cssVar("--sheet"), weight: 11, opacity: 0.9, interactive: false }).addTo(lineLayer);
  const line = L.polyline(pts, { color: cssVar("--ganga"), weight: 6, opacity: 0.95, interactive: false }).addTo(lineLayer);
  stops.forEach((s, i) => L.marker([s.lat, s.lng], { interactive: false, icon: L.divIcon({ className: "", html: `<div class="endpin">${i + 1}</div>`, iconSize: [0, 0] }) }).addTo(lineLayer));
  return line;
}
function traceSpine() {
  flashMsg = "The spine: 1 Saguna Mor, 2 Income Tax Golambar, 3 Gandhi Maidan, 4 Ashok Rajpath at PMCH, 5 Patna City. Everything else hangs off this line.";
  go({ mode: "list", trace: true });
  const st = spineStops(); if (st.length) map.flyToBounds(L.latLngBounds(st.map((x) => [x.lat, x.lng])).pad(0.15), { duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 1 });
  setTimeout(() => { if (flashMsg.startsWith("The spine")) { flashMsg = ""; render(); } }, 9000);
}
// quiz: your places, landmarks and roads, 10 at a time
let quiz = { order: [], i: 0, guess: null, total: 0, good: 0, sumKm: 0 };
const QUIZ_LEN = 10;
function quizItems() {
  return [
    ...places.map((p) => ({ kind: "place", name: p.name, lat: p.lat, lng: p.lng, note: p.note || "" })),
    ...LANDMARKS.map((l) => ({ kind: "lm", name: l.name, hi: l.hi, lat: l.lat, lng: l.lng, note: l.note })),
    ...(RD ? [...new Map(BADGES.filter((b) => RD.routes[b[0]]).map((b) => [b[0], b])).values()].map(([k, text]) => ({ kind: "road", name: text, hi: RD.routes[k].hi, road: k })) : []),
  ];
}
function startQuiz() {
  const pool = quizItems();
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  quiz = { order: pool.slice(0, QUIZ_LEN), i: 0, guess: null, total: 0, good: 0, sumKm: 0, miss: 0, target: null };
  lineLayer.clearLayers();
  go({ mode: "quiz" });
}
function quizView() {
  const p = quiz.order[quiz.i];
  if (!p) return `<h2>Round finished</h2><p class="score">${quiz.good}/${quiz.total} within 500 m · average miss ${quiz.total ? fmtKm(quiz.sumKm / quiz.total) : "—"}</p><div class="row"><button class="btn primary" type="button" data-act="quiz-again">Play again</button><button class="btn" type="button" data-act="quiz-end">Back to my map</button></div>`;
  const score = `<p class="score">Question ${quiz.i + 1} of ${quiz.order.length} · ${quiz.good}/${quiz.total} within 500 m</p>`;
  const what = p.kind === "road" ? "Tap anywhere on this road." : "Tap the map where you think it is.";
  const title = `${esc(p.name)}${p.hi ? ` <span class="hi-q">${esc(p.hi)}</span>` : ""}`;
  if (!quiz.guess) return `<p class="eyebrow">Test my memory</p><p class="q">Where is ${title}?</p>${score}<p class="notice">Labels are hidden and the map is blurred. ${what}</p><div class="row"><button class="btn" type="button" data-act="quiz-end">Stop</button></div>`;
  const d = quiz.miss;
  const cls = d <= 0.5 ? "good" : d <= 2 ? "near" : "far";
  const word = d <= 0.5 ? "Well remembered." : d <= 2 ? "Close." : "Not quite.";
  return `<p class="eyebrow">Test my memory</p><p class="q">${title}</p>${score}<p class="verdict ${cls}">${word} You were ${fmtKm(d)} away.</p>${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}<div class="row"><button class="btn primary" type="button" data-act="quiz-next">Next</button><button class="btn" type="button" data-act="quiz-end">Stop</button></div>`;
}
function quizClick(ll) {
  if (quiz.guess) return;
  const p = quiz.order[quiz.i]; if (!p) return;
  quiz.guess = { lat: ll.lat, lng: ll.lng };
  let target, d;
  if (p.kind === "road") { const n = nearestOnRoute(p.road, quiz.guess); target = n.point; d = n.d; }
  else { target = { lat: p.lat, lng: p.lng }; d = km(quiz.guess, target); }
  quiz.miss = d; quiz.total++; quiz.sumKm += d; if (d <= 0.5) quiz.good++;
  lineLayer.clearLayers();
  const ink = cssVar("--ganga");
  if (p.kind === "road") highlightRoute(p.road);
  L.marker(ll, { interactive: false, icon: L.divIcon({ className: "", html: '<div class="guess-dot"></div>', iconSize: [0, 0] }) }).addTo(lineLayer);
  L.circleMarker([target.lat, target.lng], { radius: 9, color: ink, weight: 3, fillOpacity: 0.3, interactive: false }).addTo(lineLayer);
  L.polyline([ll, [target.lat, target.lng]], { color: ink, weight: 2, dashArray: "4 6", interactive: false }).addTo(lineLayer);
  map.fitBounds(L.latLngBounds([ll, [target.lat, target.lng]]).pad(0.5), { maxZoom: 16 });
  quizRender();
}
function quizRender() { const keep = lineLayer.getLayers(); render(); keep.forEach((l) => l.addTo(lineLayer)); }

map.on("click", (e) => {
  if (view.mode === "pick") go({ mode: "edit", id: null, lat: +e.latlng.lat.toFixed(6), lng: +e.latlng.lng.toFixed(6) });
  else if (view.mode === "quiz") quizClick(e.latlng);
  else if (view.mode === "sv") go({ mode: "sv", at: { lat: e.latlng.lat, lng: e.latlng.lng } });
});

$("#btn-remember").onclick = () => { go(view.mode === "remember" ? { mode: "list" } : { mode: "remember" }); if (document.body.classList.contains("fullmap")) setFull(false); };
$("#btn-sketch").onclick = () => go(view.mode === "sketch" ? { mode: "list" } : { mode: "sketch", q: "", title: view.title || "" });
$("#sk-close").onclick = () => { $("#sketch").hidden = true; };
$("#sk-redraw").onclick = () => { sketchSeed++; drawSketch($("#sketch-canvas")); };
$("#sk-save").onclick = () => saveSketch();
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#sketch").hidden) $("#sketch").hidden = true; });
$("#btn-add").onclick = () => go(view.mode === "pick" ? { mode: "list" } : { mode: "pick" });
$("#btn-quiz").onclick = () => view.mode === "quiz" ? go({ mode: "list" }) : startQuiz();

function bind(panel) {
  panel.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => {
    const p = places.find((x) => x.id === b.dataset.open); go({ mode: "detail", id: b.dataset.open });
    if (p) map.flyTo([p.lat, p.lng], Math.max(map.getZoom(), 15), { duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 0.6 });
  });
  panel.querySelectorAll("[data-lm]").forEach((b) => b.onclick = () => {
    const i = +b.dataset.lm, l = LANDMARKS[i]; go({ mode: "lm", i });
    map.flyTo([l.lat, l.lng], Math.max(map.getZoom(), 15), { duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 0.6 });
  });
  panel.querySelectorAll("[data-road]").forEach((b) => b.onclick = () => {
    const key = b.dataset.road, pts = RD.ways.filter((w) => w[1] === key).flatMap((w) => w[3]);
    go({ mode: "road", key, tap: null });
    if (pts.length) map.flyToBounds(L.latLngBounds(pts).pad(0.15), { maxZoom: 16, duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 0.6 });
  });
  panel.querySelectorAll("[data-from]").forEach((b) => b.onclick = () => go({ ...view, from: b.dataset.from }));
  panel.querySelectorAll("[data-addsk]").forEach((b) => b.onclick = () => { const c = sketchCatalog().find((x) => x.key === b.dataset.addsk); if (c && sketchSel.length < 8) sketchSel.push(c); go({ ...view, q: "" }); });
  panel.querySelectorAll("[data-unsk]").forEach((b) => b.onclick = () => { sketchSel = sketchSel.filter((x) => x.key !== b.dataset.unsk); render(); });
  const skq = $("#sk-q", panel);
  if (skq) { skq.oninput = () => { view.q = skq.value; view.focusQ = true; render(); }; if (view.focusQ) { skq.focus(); skq.setSelectionRange(skq.value.length, skq.value.length); } }
  const skt = $("#sk-title", panel); if (skt) { skt.oninput = () => { view.title = skt.value; }; }
  const skf = $("#f-sk-title", panel); if (skf) skf.onsubmit = (e) => e.preventDefault();
  panel.querySelectorAll("[data-act]").forEach((b) => b.onclick = async () => {
    const a = b.dataset.act, p = places.find((x) => x.id === view.id);
    if (a === "back") go({ mode: "list" });
    else if (a === "open") go({ mode: "detail", id: view.id });
    else if (a === "edit") go({ mode: "edit", id: view.id });
    else if (a === "del") go({ ...view, confirmDelete: true });
    else if (a === "del-no") go({ mode: "detail", id: view.id });
    else if (a === "del-yes") { try { await col.doc(view.id).delete(); go({ mode: "list" }); } catch (e) { flash(`Could not delete: ${e?.message || "try again"}`); } }
    else if (a === "visit" && p) {
      const t = today();
      if (p.lastVisit === t) { flash("Today's visit is already counted."); return; }
      b.disabled = true;
      await save(p.id, { visits: Number(p.visits || 0) + 1, lastVisit: t, firstVisit: p.firstVisit || t });
    }
    else if (a === "quiz-next") { quiz.i++; quiz.guess = null; lineLayer.clearLayers(); render(); }
    else if (a === "quiz-again") startQuiz();
    else if (a === "trace") traceSpine();
    else if (a === "adj-on") go({ ...view, adjust: b.dataset.key });
    else if (a === "adj-done") go({ ...view, adjust: null });
    else if (a === "sk-draw") openSketch();
    else if (a === "sk-clear") { sketchSel = []; render(); }
    else if (a === "road-edit") go({ ...view, mode: "roadedit" });
    else if (a === "road-back") go({ ...view, mode: "road" });
    else if (a === "quiz-end") { lineLayer.clearLayers(); go({ mode: "list" }); }
  });
  const pf = $("#f-pos", panel);
  if (pf) pf.onsubmit = async (e) => {
    e.preventDefault();
    const ll = parseLatLng($("#pos-in", panel).value);
    if (!ll) { flash("Paste coordinates like 25.58815, 85.10591, or a full Google Maps link. Short maps.app.goo.gl links can't be read here; open them in Google Maps first and copy the full link."); return; }
    const pos = { lat: +ll.lat.toFixed(6), lng: +ll.lng.toFixed(6) };
    if (view.adjust?.startsWith("p:")) { await save(view.adjust.slice(2), { ...pos, approx: false }); }
    else if (view.adjust?.startsWith("l:")) {
      const i = +view.adjust.slice(2), l = LANDMARKS[i], rec = { ...pos, name: l.name, at: new Date().toISOString() };
      l.lat = pos.lat; l.lng = pos.lng; lmFix[lmSlug(l.name)] = rec; lmMarkers[i].setLatLng([pos.lat, pos.lng]); lmMarkers[i].setIcon(lmIcon(l));
      try { await db.collection("lmfix").doc(lmSlug(l.name)).set(rec); } catch { flash("The new position could not be saved."); return; }
    }
    rrMemo.clear(); routeCache.clear(); map.flyTo([pos.lat, pos.lng], Math.max(map.getZoom(), 16));
    go({ ...view, adjust: null }); flash("Position set and locked.");
  };
  const rf = $("#f-road", panel);
  if (rf) rf.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(rf), data = {};
    for (const k of ["builtBy", "agency", "maintainedBy", "cost", "year", "remarks"]) data[k] = String(fd.get(k) || "").trim();
    data.road = view.key; data.updatedAt = new Date().toISOString();
    rf.querySelector("[type=submit]").disabled = true;
    try { await db.collection("roads").doc(roadSlug(view.key)).set(data); go({ ...view, mode: "road" }); }
    catch (err) { flash(`Could not save: ${err?.message || "try again"}`); }
  };
  const form = $("#f-edit", panel);
  if (form) form.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const data = {
      name: String(fd.get("name") || "").trim(), category: String(fd.get("category")),
      firstVisit: String(fd.get("firstVisit") || ""), address: String(fd.get("address") || "").trim(), note: String(fd.get("note") || "").trim(),
    };
    if (!data.name) { flash("Give the place a name."); return; }
    form.querySelector("[type=submit]").disabled = true;
    try {
      if (view.id) { await save(view.id, data); go({ mode: "detail", id: view.id }); }
      else {
        const ref = await col.add({ ...data, lat: view.lat, lng: view.lng, visits: data.firstVisit ? 1 : 0, lastVisit: data.firstVisit || "", approx: false, createdAt: new Date().toISOString() });
        go({ mode: "detail", id: ref.id });
      }
    } catch (err) { flash(`Could not save: ${err?.message || "try again"}`); }
  };
}

render();
})();
