<script>
// Stand-alone mode (outside claude.ai): saves changes in this browser and seeds from seed.json
(function () {
  if (window.claude) return;
  const KEY = "patna-places:";
  const read = (c) => { try { const v = localStorage.getItem(KEY + c); return v ? JSON.parse(v) : null; } catch { return null; } };
  const write = (c, v) => { try { localStorage.setItem(KEY + c, JSON.stringify(v)); } catch {} };
  let SEED = null; const seedP = fetch("seed.json", { cache: "no-cache" }).then((r) => r.json()).then((s) => (SEED = s)).catch(() => (SEED = {}));
  const subs = {};
  const getCol = (c) => read(c) || (SEED && SEED[c] ? JSON.parse(JSON.stringify(SEED[c])) : {});
  const snap = (c) => { const o = getCol(c); return { docs: Object.entries(o).map(([id, d]) => ({ id, exists: true, data: () => d, metadata: {} })), size: Object.keys(o).length, empty: !Object.keys(o).length, docChanges: () => [], metadata: {} }; };
  const emit = (c) => (subs[c] || []).forEach((f) => { try { f(snap(c)); } catch (e) { console.error(e); } });
  const mut = (c, fn) => { const o = getCol(c); fn(o); write(c, o); setTimeout(() => emit(c), 0); };
  const db = {
    collection(c) {
      return {
        path: c,
        onSnapshot(f) { (subs[c] = subs[c] || []).push(f); seedP.then(() => f(snap(c))); return () => { subs[c] = subs[c].filter((x) => x !== f); }; },
        async get() { await seedP; return snap(c); },
        doc(id) {
          id = id || Math.random().toString(36).slice(2, 12);
          return { id, path: c + "/" + id,
            async get() { await seedP; const d = getCol(c)[id]; return { id, exists: !!d, data: () => d }; },
            async set(d) { await seedP; mut(c, (o) => { o[id] = JSON.parse(JSON.stringify(d)); }); },
            async update(d) { await seedP; mut(c, (o) => { o[id] = { ...(o[id] || {}), ...JSON.parse(JSON.stringify(d)) }; }); },
            async delete() { await seedP; mut(c, (o) => { delete o[id]; }); } };
        },
        async add(d) { const ref = this.doc(); await ref.set(d); return ref; },
      };
    },
  };
  const downloads = { async save({ filename, data }) { const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); } };
  window.claude = { use: async (n) => (n === "db" ? db : n === "downloads" ? downloads : null) };
})();

// Google's route with traffic now. Results are kept for 10 minutes only (no long-term caching).
const gRoutes = new Map();
const gKey = (a, b) => `${(+a.lat).toFixed(5)},${(+a.lng).toFixed(5)}>${(+b.lat).toFixed(5)},${(+b.lng).toFixed(5)}`;
function gRoute(a, b) {
  const k = gKey(a, b), hit = gRoutes.get(k);
  if (hit && Date.now() - hit.t < 600000) return hit;
  const rec = { t: Date.now(), state: "loading" }; gRoutes.set(k, rec);
  (async () => {
    try {
      if (!(await gReady())) { rec.state = "off"; return; }
      const { Route } = await google.maps.importLibrary("routes");
      const { routes } = await Route.computeRoutes({ origin: { lat: +a.lat, lng: +a.lng }, destination: { lat: +b.lat, lng: +b.lng }, travelMode: "DRIVING", routingPreference: "TRAFFIC_AWARE", fields: ["distanceMeters", "durationMillis", "path"] });

      else {
        rec.state = "ok"; rec.km = r.distanceMeters / 1000; rec.min = Math.max(1, Math.round(r.durationMillis / 60000));
        rec.path = (r.path || []).map((p) => [typeof p.lat === "function" ? p.lat() : p.lat, typeof p.lng === "function" ? p.lng() : p.lng]);
      }
    } catch (e) {
      rec.state = "err"; rec.msg = /not (been )?(used|enabled)|PERMISSION|403|API_KEY/i.test(String(e?.message || e)) ? "Turn on the Routes API for your key in Google Cloud." : "Google could not find a route just now.";
    }

    if (view.groute) drawLines();

}
function gRouteText(rec) {

  let best = null; for (const h of rsHits) { const d = Math.hypot(h.x - x, h.y - y); if (h.kind !== "start" && h.kind !== "end" && d < 30 && (!best || d < best.d)) best = { ...h, d }; }
  if (best) { rs.hidden.add(best.id); rsApplyHidden(); render(); syncSkBar(); }
});
$("#sk-saveroute").onclick = () => rsSave();
$("#sk-restore").onclick = () => { rs.hidden.clear(); rsApplyHidden(); render(); syncSkBar(); };
$("#sk-redraw").onclick = () => { sketchSeed++; if (view.mode === "rsketch" && rs.S) drawRouteSketch($("#sketch-canvas")); else drawSketch($("#sketch-canvas")); };
$("#sk-save").onclick = () => saveSketch();
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#sketch").hidden) $("#sketch").hidden = true; });
$("#btn-add").onclick = () => go(view.mode === "pick" ? { mode: "list" } : { mode: "pick" });
$("#btn-quiz").onclick = () => view.mode === "quiz" ? go({ mode: "list" }) : startQuiz();

function bind(panel) {
  panel.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => {
    const p = places.find((x) => x.id === b.dataset.open); go({ mode: "detail", id: b.dataset.open });
    if (p) map.flyTo([p.lat, p.lng], Math.max(map.getZoom(), 15), { duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 0.6 });
  });
  panel.querySelectorAll("[data-lm]").forEach((b) => b.onclick = () => {
    const i = +b.dataset.lm, l = LANDMARKS[i]; go({ mode: "lm", i });
    map.flyTo([l.lat, l.lng], Math.max(map.getZoom(), 15), { duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 0.6 });
  });
  panel.querySelectorAll("[data-road]").forEach((b) => b.onclick = () => {
    const key = b.dataset.road, pts = RD.ways.filter((w) => w[1] === key).flatMap((w) => w[3]);
    go({ mode: "road", key, tap: null });
    if (pts.length) map.flyToBounds(L.latLngBounds(pts).pad(0.15), { maxZoom: 16, duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 0.6 });
  });
  panel.querySelectorAll("[data-from]").forEach((b) => b.onclick = () => go({ ...view, from: b.dataset.from }));
  panel.querySelectorAll("[data-addsk]").forEach((b) => b.onclick = () => { const c = sketchCatalog().find((x) => x.key === b.dataset.addsk); if (c && sketchSel.length < 8) sketchSel.push(c); go({ ...view, q: "" }); });
  panel.querySelectorAll("[data-unsk]").forEach((b) => b.onclick = () => { sketchSel = sketchSel.filter((x) => x.key !== b.dataset.unsk); render(); });
  const skq = $("#sk-q", panel);
  if (skq) { skq.oninput = () => { view.q = skq.value; view.focusQ = true; render(); }; if (view.focusQ) { skq.focus(); skq.setSelectionRange(skq.value.length, skq.value.length); } }
  const skt = $("#sk-title", panel); if (skt) { skt.oninput = () => { view.title = skt.value; }; }
  const skf = $("#f-sk-title", panel); if (skf) skf.onsubmit = (e) => e.preventDefault();
  // route sketch: typing, picking and changing the From / To places
  panel.querySelectorAll("[data-rsq]").forEach((inp) => {
    inp.oninput = () => { view.rq = inp.value; view.rqw = inp.dataset.rsq; render(); };
    inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); const first = panel.querySelector(`[data-rspick^="${inp.dataset.rsq}:"]`); if (first) first.click(); } };
    if (view.rqw === inp.dataset.rsq) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  });
  panel.querySelectorAll("[data-rspick]").forEach((b) => b.onclick = () => { const [w, i] = b.dataset.rspick.split(":"); const h = rsCandidates(view.rq || "")[+i]; if (h) { rsPick(w, h); if (w === "from" && !rs.to) { view.rqw = "to"; render(); } } });
  panel.querySelectorAll("[data-rsedit]").forEach((b) => b.onclick = () => go({ ...view, rqw: b.dataset.rsedit, rq: "" }));
  panel.querySelectorAll("[data-rsopt]").forEach((b) => b.onclick = () => { rsChoose(+b.dataset.rsopt); render(); });
  panel.querySelectorAll("[data-rsopen]").forEach((b) => b.onclick = () => rsOpenSaved(b.dataset.rsopen));
  panel.querySelectorAll("[data-rsdel]").forEach((b) => b.onclick = () => go({ ...view, rsDel: b.dataset.rsdel }));
  panel.querySelectorAll("[data-rsdelyes]").forEach((b) => b.onclick = async () => { try { await db.collection("sketches").doc(b.dataset.rsdelyes).delete(); } catch {} go({ ...view, rsDel: null }); });
  const rsf = $("#f-rs-save", panel); if (rsf) { const ti = $("#rs-title", panel); ti.oninput = () => { view.rsTitle = ti.value; }; rsf.onsubmit = (e) => { e.preventDefault(); rsSave(); }; }
  panel.querySelectorAll("[data-rshide]").forEach((b) => b.onclick = () => { rs.hidden.add(+b.dataset.rshide); rsApplyHidden(); render(); });
  panel.querySelectorAll("[data-act]").forEach((b) => b.onclick = async () => {
    const a = b.dataset.act, p = places.find((x) => x.id === view.id);
    if (a === "back") go({ mode: "list" });
    else if (a === "open") go({ mode: "detail", id: view.id });
    else if (a === "edit") go({ mode: "edit", id: view.id });
    else if (a === "del") go({ ...view, confirmDelete: true });
    else if (a === "del-no") go({ mode: "detail", id: view.id });
    else if (a === "del-yes") { try { await col.doc(view.id).delete(); go({ mode: "list" }); } catch (e) { flash(`Could not delete: ${e?.message || "try again"}`); } }
    else if (a === "visit" && p) {
      const t = today();
      if (p.lastVisit === t) { flash("Today's visit is already counted."); return; }
      b.disabled = true;
      await save(p.id, { visits: Number(p.visits || 0) + 1, lastVisit: t, firstVisit: p.firstVisit || t });
    }
    else if (a === "quiz-next") { quiz.i++; quiz.guess = null; lineLayer.clearLayers(); render(); }
    else if (a === "quiz-again") startQuiz();
    else if (a === "trace") traceSpine();
    else if (a === "adj-on") go({ ...view, adjust: b.dataset.key });
    else if (a === "adj-done") go({ ...view, adjust: null });
    else if (a === "sk-draw") openSketch();
    else if (a === "sk-route") { bhPlacesReady().then(render).catch(() => {}); bhLayersReady().catch(() => {}); go({ mode: "rsketch", rqw: rs.from ? null : "from", rq: "" }); }
    else if (a === "sk-places") go({ mode: "sketch", q: "", title: view.title || "" });
    else if (a === "rs-go") rsFind();
    else if (a === "rs-swap") { [rs.from, rs.to] = [rs.to, rs.from]; rs.R = null; rs.S = null; rsFind(); }
    else if (a === "rs-draw") openRouteSketch();
    else if (a === "rs-saved-toggle") go({ ...view, rsShowSaved: view.rsShowSaved === false });
    else if (a === "rs-delno") go({ ...view, rsDel: null });
    else if (a === "offline") saveOffline(b);
    else if (a === "rs-restore") { rs.hidden.clear(); rsApplyHidden(); render(); }
    else if (a === "bp-route-from" || a === "bp-route-to") {
      const h = anchor("home"), g = view.g, here = { name: g.name, hi: g.hi, sub: g.sub, lat: g.lat, lng: g.lng }, home = h ? { name: h.name, hi: "", sub: "Your place", lat: +h.lat, lng: +h.lng } : null;
      rs.from = a === "bp-route-from" ? home : here; rs.to = a === "bp-route-from" ? here : null; rs.R = null; rs.S = null;
      go({ mode: "rsketch", rqw: rs.to ? null : "to", rq: "" }); if (rs.from && rs.to) rsFind();
    }
    else if (a === "sk-clear") { sketchSel = []; render(); }
    else if (a === "road-edit") go({ ...view, mode: "roadedit" });
    else if (a === "road-back") go({ ...view, mode: "road" });
    else if (a === "quiz-end") { lineLayer.clearLayers(); go({ mode: "list" }); }
    else if (a === "groute") {
      if (view.groute) { go({ ...view, groute: false }); return; }
      const v = { ...view, groute: true };
      if (!isGoogle()) { view = v; await setBase("g"); if (!isGoogle()) view.groute = false; render(); } else go(v);
    }
    else if (a === "gkey-del") { try { localStorage.removeItem(GKEY_K); localStorage.removeItem(BASE_K); } catch {} location.reload(); }
  });
  const gk = $("#f-gkey", panel);
  if (gk) gk.onsubmit = (e) => {
    e.preventDefault();
    const k = $("#gkey-in", panel).value.trim();
    if (!/^[A-Za-z0-9_\-]{30,60}$/.test(k)) { flash("That doesn't look like a Google API key. It is about 39 letters and numbers and usually starts with AIza."); return; }
    try { localStorage.setItem(GKEY_K, k); } catch { flash("This browser would not save the key. Turn off private browsing and try again."); return; }
    location.reload();
  };
  const pf = $("#f-pos", panel);
  if (pf) pf.onsubmit = async (e) => {
    e.preventDefault();
    const ll = parseLatLng($("#pos-in", panel).value);
    if (!ll) { flash("Paste coordinates like 25.58815, 85.10591, or a full Google Maps link. Short maps.app.goo.gl links can't be read here; open them in Google Maps first and copy the full link."); return; }
    const pos = { lat: +ll.lat.toFixed(6), lng: +ll.lng.toFixed(6) };
    if (view.adjust?.startsWith("p:")) { await save(view.adjust.slice(2), { ...pos, approx: false }); }
    else if (view.adjust?.startsWith("l:")) {
      const i = +view.adjust.slice(2), l = LANDMARKS[i], rec = { ...pos, name: l.name, at: new Date().toISOString() };
      l.lat = pos.lat; l.lng = pos.lng; lmFix[lmSlug(l.name)] = rec; lmMarkers[i].setLatLng([pos.lat, pos.lng]); lmMarkers[i].setIcon(lmIcon(l));
      try { await db.collection("lmfix").doc(lmSlug(l.name)).set(rec); } catch { flash("The new position could not be saved."); return; }
    }
    rrMemo.clear(); routeCache.clear(); map.flyTo([pos.lat, pos.lng], Math.max(map.getZoom(), 16));
    go({ ...view, adjust: null }); flash("Position set and locked.");
  };
  const rf = $("#f-road", panel);
  if (rf) rf.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(rf), data = {};
    for (const k of ["builtBy", "agency", "maintainedBy", "cost", "year", "remarks"]) data[k] = String(fd.get(k) || "").trim();
    data.road = view.key; data.updatedAt = new Date().toISOString();
    rf.querySelector("[type=submit]").disabled = true;
    try { await db.collection("roads").doc(roadSlug(view.key)).set(data); go({ ...view, mode: "road" }); }
    catch (err) { flash(`Could not save: ${err?.message || "try again"}`); }
  };
  const form = $("#f-edit", panel);
  if (form) form.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const data = {
      name: String(fd.get("name") || "").trim(), category: String(fd.get("category")),
      firstVisit: String(fd.get("firstVisit") || ""), address: String(fd.get("address") || "").trim(), note: String(fd.get("note") || "").trim(),
    };
    if (!data.name) { flash("Give the place a name."); return; }
    form.querySelector("[type=submit]").disabled = true;
    try {
      if (view.id) { await save(view.id, data); go({ mode: "detail", id: view.id }); }
      else {
        const ref = await col.add({ ...data, lat: view.lat, lng: view.lng, visits: data.firstVisit ? 1 : 0, lastVisit: data.firstVisit || "", approx: false, createdAt: new Date().toISOString() });
        go({ mode: "detail", id: ref.id });
      }
    } catch (err) { flash(`Could not save: ${err?.message || "try again"}`); }
  };
}

// ---------- keep every data file in the service worker's cache for offline use ----------
async function saveOffline(btn) {
  const files = ["index.html", "seed.json", "roads.json", "roadnet.json", "tiles.json", "satellite.json", "bihar/layers.json", "bihar/places.json", "bihar/net.json", "manifest.webmanifest", "icon-192.png", "icon-512.png", "icon.svg"];
  if (!navigator.serviceWorker?.controller) { flash("Reload the page once, then try again (the offline helper starts on the second visit)."); return; }
  let done = 0; btn.disabled = true;
  for (const f of files) {
    try { const r = await fetch(f, { cache: "reload" }); await r.arrayBuffer(); if (r.ok) done++; } catch {}
    btn.textContent = `Downloading… ${Math.round(done / files.length * 100)}%`;
  }
  try { await navigator.storage?.persist?.(); } catch {}
  btn.disabled = false; btn.textContent = "⬇ Download map data";
  flash(done === files.length ? "All map data is on this device now. The app works without internet (except web backgrounds and Google)." : `Downloaded ${done} of ${files.length} files. Check your connection and try again.`);
}

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
let installEvt = null;
const isStandalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; if (!isStandalone) $("#btn-install").hidden = false; });

if (isIOS && !isStandalone) $("#btn-install").hidden = false;
$("#btn-install").onclick = async () => {
  if (installEvt) { installEvt.prompt(); try { const { outcome } = await installEvt.userChoice; if (outcome === "accepted") $("#btn-install").hidden = true; } catch {} installEvt = null; }
  else if (isIOS) flash("On iPhone or iPad: open this page in Safari, tap the Share button, then “Add to Home Screen”.");
  else flash("Open Chrome's menu (⋮) and choose “Add to Home screen” or “Install app”.");
};

(() => { let b = "map"; try { b = localStorage.getItem(BASE_K) || "map"; } catch {} if (b === "sat" || ((b === "g" || b === "gs") && G.key)) setBase(b); })();
